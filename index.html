<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotiNotes</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
    input { width: 70%; padding: 10px; margin-bottom: 10px; }
    button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; }
    ul { list-style-type: none; padding: 0; }
    li { background: #f4f4f4; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; }
    .delete-btn { background: #dc3545; }
  </style>
</head>
<body>
  <h2>הפתקים שלי להתראות</h2>
  <input type="text" id="noteInput" placeholder="הכנס פתק חדש...">
  <button id="addBtn">הוסף פתק</button>
  <ul id="notesList"></ul>

  <script type="module" src="/main.js"></script>
</body>
</html>
